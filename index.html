<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NeonFox</title>
    <!--
      Which language the page speaks, settled before anything paints (hub
      CLAUDE.md §2, "Two languages, Norwegian first"). Bokmål unless the
      player has chosen English somewhere in the arcade; arcade.lang.v1 is one
      key for every game on the origin. js/i18n.js reads the same key and
      agrees with this; it only runs later, as a module, which is why this
      tiny classic copy exists at all. The markup below is written in bokmål
      for the same reason, so the common case never flashes.
    -->
    <script>
      try {
        if (localStorage.getItem("arcade.lang.v1") === "en")
          document.documentElement.lang = "en";
      } catch (e) {
        /* No storage: bokmål, which is what the markup already says. */
      }
    </script>
    <meta
      name="description"
      content="Foxes running on glowing orbs, leaving neon trails in a small arena. Touch a trail or the wall and you are out; the last one riding takes the round. A 3D take on Achtung, die Kurve."
    />
    <meta name="theme-color" content="#0a1030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!--
      The PWA layer. Every path here is RELATIVE, so the game works from
      /trailblazers/ (the repo's working name), from /neonfox/ once the repo is
      renamed, and from a domain root, with no edits. The arcade reads this
      manifest to build the game's cabinet: it splits `name` on the em-dash into
      a title and a tagline, so that field is doing two jobs.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <!--
      The mark is codex's, not procedural: the artwork and the prompt that
      made it live in codex-concepts/branding/pwa-icons/, which is the source
      these PNGs were exported from. A real 180 for iOS, not the 192 pointed
      at sideways. Two small favicons rather than an inline SVG, because the
      fox does not survive being reduced to two shapes.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16.png"
    />

    <link rel="stylesheet" href="css/style.css" />
    <!--
      What quitting means here: back to the arcade when the arcade is what
      framed us, closing the window when we are installed, and an honest
      note when we are a tab no script may close (arcade/exit.js's own
      header explains why). It draws nothing — the quit button below, in
      the menu, is NeonFox's own. Classic and deferred on purpose, so
      /arcade/ being unreachable costs only that button, never the page.

      It is EXPECTED to 404 sometimes, and data-handled says so: the crash
      bar at the bottom of this file skips any script tag carrying that
      attribute. Serve this directory on its own — `python3 -m http.server`
      rooted at the game rather than at ~/projects/games — and "../" cannot
      climb above the server root, so the browser asks for /arcade/exit.js
      and is told no. On ivaruf.github.io/neonfox/ the same relative path
      reaches the sibling repo and loads. js/ui.js only ever asks whether
      window.ArcadeExit turned up, so both outcomes are already correct;
      what would be wrong is a red bar announcing a missing file the game
      was written not to need.
    -->
    <script src="../arcade/exit.js" defer data-handled="optional"></script>
    <!-- The address change. Inert until gophercloud.games answers; see the file. -->
    <script src="moved.js" defer></script>
    <!-- Selection and the long-press menu off outside text fields. Classic
         and self-contained, never a module, so nothing else can take it down;
         a same-repo file that loads, so no data-handled. -->
    <script src="js/touch-guard.js" defer></script>
  </head>
  <body>
    <!--
      The opening sting: six trails, a flash, the logo landing in its place
      on the start screen. A curtain over the page, never a gate in front of
      it, and skipped by any tap or key; see the file. ASYNC AND FIRST IN THE
      BODY, not deferred in the head: a deferred script waits for the whole
      document to parse, and parsing stops at the Babylon tag at the bottom
      until 7.5 MB has arrived — so a deferred sting would start only once the
      wait it exists to cover was over. Here it runs as soon as it is fetched,
      with <body> already there to hang the canvas on, and still before any
      of the game's own key listeners exist.
    -->
    <script src="js/intro.js" async></script>
    <!--
      The whole game is one WebGL canvas with DOM floating over it. The DOM
      carries everything a player reads or taps (menu, scores, banners, the
      two touch buttons); the canvas carries everything that moves. See
      README.md for the architecture.
    -->
    <canvas id="arena" data-i18n-label="arena.label" aria-label="NeonFox-arenaen"></canvas>

    <div id="ui">
      <!-- The start screen. Sits over the live attract-mode arena. -->
      <section id="menu" class="panel" aria-labelledby="title">
        <!--
          The logo carries the name, so the heading keeps the text for a
          screen reader and anyone the image fails for, and hides it behind
          the artwork otherwise. Width and height are on the tag so the panel
          does not jump when it loads.
        -->
        <h1 id="title">
          <img
            src="art/logo.webp"
            alt="NeonFox"
            width="880"
            height="576"
            decoding="async"
          />
        </h1>
        <p class="kicker" data-i18n="kicker">Neon-Kurve for kuleryttere</p>

        <!--
          UPDATE READY. Hidden until a new service worker has installed and is
          waiting; tapping it is the only thing in the whole game that posts
          SKIP_WAITING. It sits inside #menu on purpose — the panel is hidden
          for the whole of a match, so the control simply does not exist on
          screen while a round is running and no deploy can end one. Owned end
          to end by js/update.js, which nothing else imports.
        -->
        <button type="button" id="update" hidden>
          <!-- js/update.js writes both lines, in the current language. -->
          <span class="update-title">Ny versjon klar</span>
          <span class="update-sub">Trykk for å hente den</span>
        </button>

        <!-- data-seg="humans" is untouched by the rename: that string is the
             contract js/ui.js reads, not something the player ever sees. -->
        <div class="row" id="row-riders">
          <span class="label" data-i18n="row.players">Spillere</span>
          <div
            class="seg"
            data-seg="humans"
            role="group"
            data-i18n-label="row.players"
            aria-label="Spillere"
          >
            <button type="button" data-v="1" aria-pressed="true" data-i18n="mode.solo">Alene</button>
            <button type="button" data-v="2" data-i18n="mode.two">To spillere</button>
          </div>
        </div>

        <div class="row" id="row-rivals">
          <span class="label" data-i18n="row.bots">Roboter</span>
          <div class="seg" data-seg="ai" role="group" data-i18n-label="row.bots" aria-label="Roboter">
            <button type="button" data-v="1">1</button>
            <button type="button" data-v="2">2</button>
            <button type="button" data-v="3" aria-pressed="true">3</button>
            <button type="button" data-v="4">4</button>
            <button type="button" data-v="5">5</button>
          </div>
        </div>

        <div class="row" id="row-arena">
          <label class="label" for="arena-size" data-i18n="row.arena">Arena</label>
          <div class="slider">
            <input
              type="range"
              id="arena-size"
              min="0"
              max="4"
              step="1"
              value="2"
              aria-valuetext="Klassisk"
            />
            <output id="arena-name" for="arena-size">Klassisk</output>
          </div>
        </div>

        <!--
          How tightly everyone turns. A slider rather than a segmented row
          because, like Arena, it is an ordered scale with a name at each
          stop — and four names do not fit four pills on a phone. It is a rule
          of the match, not a preference of a player: one rate for every
          rider, and in a net game the host's choice travels with the roster.
        -->
        <div class="row" id="row-turn">
          <label class="label" for="turn-mode" data-i18n="row.turn">Svinger</label>
          <div class="slider">
            <input
              type="range"
              id="turn-mode"
              min="0"
              max="3"
              step="1"
              value="1"
              aria-valuetext="Klassisk"
            />
            <output id="turn-name" for="turn-mode">Klassisk</output>
          </div>
        </div>

        <div class="row" id="row-target">
          <label class="label" for="target" data-i18n="row.target">Spill til</label>
          <div class="slider">
            <input
              type="range"
              id="target"
              min="5"
              max="60"
              step="5"
              value="15"
            />
            <output id="target-out" for="target">15 poeng</output>
          </div>
        </div>

        <!--
          The start screen's two doors, and they are the same size on purpose.
          They are named plainly, Play and Multiplayer, since 2026-10-10: the
          owner wanted no cute words in a menu (hub §2), so "Blaze!" went.
          The way in to a local match used to be a full-width gradient with the multiplayer door as
          a thin ghost pill beneath it, which read as the game plus a footnote.
          Riding against a friend on another screen is the same kind of
          choice as riding against the rivals, so it gets the same pill; only
          the gradient differs, and both are mixed from the rider palette.
        -->
        <div class="play">
          <button type="button" id="start" class="primary" data-i18n="play">Spill</button>
          <button type="button" id="together" class="primary together" data-i18n="multiplayer">Flerspiller</button>
        </div>

        <p class="hint">
          <kbd>←</kbd><kbd>→</kbd> <span data-i18n="hint.steer">styrer</span> ·
          <span data-i18n="hint.two">spiller to på</span> <kbd>A</kbd
          ><kbd>D</kbd> · <kbd>Esc</kbd> <span data-i18n="hint.pause">pause</span> ·
          <span data-i18n="hint.aim">styr mens runden starter for å sikte</span>
        </p>

        <!--
          Leaving the arcade. Sound and fullscreen used to sit beside this as
          two more word pills; they are plates in the top-right corner now
          (#corner-tools, further down) — sound behind the menu one, and mute
          as a plate of its own — because none of them is about the game and
          all are wanted from more than one screen. This one stays in the
          panel: it is a sentence, not a symbol, and it only exists at all
          when js/ui.js finds window.ArcadeExit — a browser or a hosting
          context that cannot do the thing never shows a button that would do
          nothing.
        -->
        <!--
          ONE BUTTON IN EVERY CABINET (hub §2, 2026-10-11): the same back
          arrow, the same sentence-case words and the same place — last in the
          column, its full width, a little further off than the rows above —
          in every game, so a player crossing from one to the next finds the
          way out without reading for it. js/ui.js writes the words into the
          span, through ArcadeExit.verb(), so the drawing survives a language
          switch.
        -->
        <div class="menu-tools">
          <button type="button" id="quit" class="ghost exit" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
            <span class="exit-label">Tilbake til arkaden</span>
          </button>
        </div>

        <!--
          Which build is actually serving this session, asked of the service
          worker rather than baked into the page — a string compiled into the
          HTML tells you where the HTML came from, which during a bad release is
          the one thing you already know. Stays hidden when there is no worker.
        -->
        <p id="build" hidden></p>
      </section>

      <!--
        THE CORNER: menu, mute, fullscreen — three plates, reading left to
        right, with fullscreen outermost at the corner itself. fishtank's
        shape and the set maxgear arrived at from the other end, and the one
        the whole hub is heading for: none of the three belongs to a round,
        none of them is a setting of the game, and a symbol survives being
        shrunk to a corner where a word does not.

        FIXED TO THE PAGE, ON EVERY SCREEN AND MID-MATCH. The cluster used to
        be shown with the paddock and taken away for a round, because a Pause
        pill wanted this corner too — and what that cost was a player who,
        having started riding, could not fill the screen or turn the music
        down without ending the match first. That pill is gone as of v1.9:
        pausing is what the MENU plate does, so the thing that was fighting
        for the corner is now the first thing in it.

        THE FIRST TWO PLATES ARE DELIBERATELY DIFFERENT IN KIND, and that is
        the whole point of drawing them side by side. The MENU plate opens the
        panel below and stops the round when the round is this device's to
        stop — a game played together is the host's simulation and carries on,
        which the panel says rather than pretends. The MUTE plate touches
        nothing but the sound, ever.
        Somebody walking into the room is a different question from
        setting a mix, and a player silencing the arena for them must not lose
        the round they are riding for it — so mute opens no panel, closes
        none, moves no focus and never pauses, mid-match included. M does the
        same from the keyboard.

        Art carries the meaning, so each button carries a real aria-label and
        a title. js/screen.js rewrites the fullscreen one as the state
        changes and js/ui.js rewrites mute's — the label is the only thing
        that can tell a screen reader which way a toggle is pointing, and in
        both cases the picture is swapped by CSS off the same aria-pressed so
        the two cannot drift.
      -->
      <div id="corner-tools">
        <!--
          THE MENU. Three bars and not a gear: a gear says settings, and this
          holds more than settings — mid-match it is the pause, with the way
          to restart and the way out under it. It was a speaker until v1.9,
          when the mixer stopped being a door of its own and moved inside the
          one panel this opens.
        -->
        <button
          type="button"
          id="menu-open"
          class="icon-button"
          aria-label="Meny"
          title="Meny (Esc)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <!--
          MUTE, and it is a toggle rather than a door: one press for silence,
          no menu in the way and nothing else moved. The two sliders behind
          the menu keep their levels while it is down — this is a master gain
          above both of them (js/audio.js), not a pair of zeroes written over
          the mix — so unmuting gives back exactly what was set.
          aria-pressed carries the state, the CSS draws the slash off it, and
          js/ui.js writes the label in the same breath.
        -->
        <button
          type="button"
          id="mute-toggle"
          class="icon-button"
          aria-pressed="false"
          aria-label="Lyd av"
          title="Lyd av (M)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <path
              class="icon-waves"
              d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"
            />
            <path class="icon-slash" d="m15.5 9.5 6 5m0-5-6 5" />
          </svg>
        </button>
        <!--
          Hidden until js/screen.js has checked that this browser has element
          fullscreen at all — iPhone Safari does not, and a button that does
          nothing when pressed is worse than no button.
        -->
        <button
          type="button"
          id="screen-toggle"
          class="icon-button"
          aria-pressed="false"
          aria-label="Fullskjerm"
          title="Fullskjerm"
          hidden
        >
          <!-- Four corners pushing out, and the same four pulled in for the
               pressed state. CSS shows one and hides the other.
               Every subpath of both is ABSOLUTE. .icon-on used to chain `m`
               moves from wherever the previous bracket ended, which is how its
               bottom-left corner came to sit at (3,15) — hard against the left
               edge with its arms pointing the wrong way — while the other three
               sat inset 9 from their own two edges. One asymmetric bracket in a
               glyph of four reads as a broken line, and it was copied out of
               here into five other games before anyone looked at it straight.
               The four corners are (9,9), (15,9), (9,15) and (15,15) now: each
               inset 9, every arm 6 long and pointing outward, symmetric about
               the centre. Absolute moves are what keep it that way — with
               relative ones, changing one arm silently moves the next bracket. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="icon-off" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
            <path
              class="icon-on"
              d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6"
            />
          </svg>
        </button>
      </div>

      <!--
        The scrim behind the pause panel, and only behind that one. It is its
        own element rather than a ::before on #pause because a negative
        z-index child paints above its parent's own background, which would
        tint the glass it is meant to sit behind. js/ui.js shows it only for a
        match that is genuinely stopped: a net game carries on without this
        device, and dimming an arena somebody is still riding in would be a
        lie told in CSS. It sits before #pause and after nothing, so the
        scoreboard and the touch buttons still paint over the top of it.
      -->
      <div id="pause-scrim" hidden></div>

      <!--
        THE ONE PANEL, AND ITS CONTENTS ADAPT. There were two until v1.9 — a
        #sound mixer opened by the corner speaker, and this pause overlay with
        a SECOND pair of the same two sliders bolted into it. One setting, two
        sets of controls, and a helper in js/ui.js whose only job was stopping
        them being seen to disagree. They are one panel now, one pair of
        sliders, one set of listeners, and there is nothing left to keep in
        step.

        What is in it answers where it was opened from, and js/ui.js paints
        that by hiding what does not apply:

          mid-match   the pause — kicker, heading, note, the two levels,
                      Keep riding, and the two ways to throw the match away
          elsewhere   the mixer — the two levels and the way back to whatever
                      panel it displaced (the paddock, or the lobby)

        Escape raises and lowers it; so does the corner's menu plate. It is
        the only thing between a player and the two irreversible acts in this
        game, restarting the match and leaving it, which is why both of those
        live here rather than on a bare keypress.

        Everything that reads differently for a net match is written by
        js/ui.js when it opens this: a game on two screens cannot be stopped
        from one of them, and the panel says so rather than pretending.

        tabindex="-1" is here so opening it can put focus inside the thing
        that just appeared instead of dropping it on the body.
      -->
      <section
        id="pause"
        class="panel"
        aria-labelledby="pause-title"
        tabindex="-1"
        hidden
      >
        <!-- All three lines are written by js/ui.js for the face it opens with. -->
        <p class="kicker" id="pause-kicker"></p>
        <h2 id="pause-title">Meny</h2>
        <p class="hint" id="pause-note"></p>

        <!--
          The one pair of volume sliders in the game. They kept these ids
          through the merge and the pause overlay's own `pause-` prefixed pair
          is what went, so nothing that reads a level had to learn a new name.
        -->
        <div class="row">
          <label class="label" for="music-vol" data-i18n="row.music">Musikk</label>
          <div class="slider">
            <input
              type="range"
              id="music-vol"
              min="0"
              max="100"
              step="1"
              value="60"
            />
            <output id="music-vol-out" for="music-vol">60</output>
          </div>
        </div>

        <div class="row">
          <label class="label" for="sfx-vol" data-i18n="row.sfx">Effekter</label>
          <div class="slider">
            <input
              type="range"
              id="sfx-vol"
              min="0"
              max="100"
              step="1"
              value="80"
            />
            <output id="sfx-vol-out" for="sfx-vol">80</output>
          </div>
        </div>

        <!--
          THE LANGUAGE ROW (hub §2, "Two languages, Norwegian first"). It
          lives here, behind the three-bar plate, because that plate is on
          every screen: from the start screen it opens this panel as Settings,
          before a run has begun, which is when a stranger who cannot read
          the Norwegian the game opened in needs it most. Two equal pills,
          Norsk first, each with its flag and its own name in its own
          language — lang="nb" / lang="en" so a screen reader says it right.
          js/ui.js wires it and keeps aria-pressed on the chosen one.

          The flags are kitchens/index.html's two SVGs, drawn the same in every
          game. The Union Jack's clipPath ids are page-global, so they carry a
          neonfox prefix rather than kitchens' bare uk-clip — a second copy
          anywhere on this page must take ids of its own too. The row lives
          here and nowhere else (hub §2, "Two languages", Where, as of
          2026-10-11): the start screen reaches it through the three-bar
          plate in its corner and spends its own room on the doors and the
          way out.
        -->
        <div class="row" id="row-lang">
          <span class="label" data-i18n="lang.label">Språk</span>
          <div
            class="seg lang"
            role="group"
            data-i18n-label="lang.label"
            aria-label="Språk"
          >
            <button type="button" data-lang="nb" lang="nb" aria-pressed="true">
              <svg class="flag" viewBox="0 0 22 16" aria-hidden="true">
                <rect width="22" height="16" fill="#ba0c2f"/>
                <path d="M6 0h4v16H6zM0 6h22v4H0z" fill="#fff"/>
                <path d="M7 0h2v16H7zM0 7h22v2H0z" fill="#00205b"/>
              </svg>
              <span>Norsk</span>
            </button>
            <button type="button" data-lang="en" lang="en" aria-pressed="false">
              <svg class="flag" viewBox="0 0 60 30" aria-hidden="true">
                <clipPath id="nf-uk-clip"><path d="M0 0v30h60V0z"/></clipPath>
                <clipPath id="nf-uk-diag"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath>
                <g clip-path="url(#nf-uk-clip)">
                  <path d="M0 0v30h60V0z" fill="#012169"/>
                  <path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/>
                  <path d="M0 0l60 30m0-30L0 30" clip-path="url(#nf-uk-diag)" stroke="#c8102e" stroke-width="4"/>
                  <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/>
                  <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/>
                </g>
              </svg>
              <span>English</span>
            </button>
          </div>
        </div>

        <button type="button" id="resume" class="primary" data-i18n="resume">Fortsett</button>

        <!--
          The two ways out, both of which throw the match away, both kept
          deliberately quiet next to Resume. #pause-restart is hidden by
          js/ui.js for a guest in a net match, where calling for another match
          is the host's alone and this button would do nothing. The pair goes
          altogether when there is no match: outside one they would both be
          lies, and js/ui.js hides the row by its id.
        -->
        <div class="menu-tools" id="pause-tools">
          <button type="button" id="pause-restart" class="ghost" data-i18n="restart">Start på nytt</button>
          <button type="button" id="pause-leave" class="ghost" data-i18n="quit.match">Avslutt kampen</button>
        </div>

        <!--
          The way out when this is a mixer rather than a pause — there is no
          Resume to serve as one. It says Back and nothing more, whichever
          panel it returns to (hub §2: a panel's back button says "Back", not
          the name of the screen behind it), and Escape leaves through the
          same function.
        -->
        <button type="button" id="menu-back" class="ghost" data-i18n="back">Tilbake</button>

        <!--
          The way out of the ARCADE, at the top level of the in-match menu and
          last in it, rather than one screen further on behind Quit match and
          the paddock. Shown by js/ui.js only on the pause face — on the
          paddock's Settings face this is a second panel and the way out is on
          the paddock itself, where it belongs — and only when
          window.ArcadeExit says there is somewhere to go. The same button as
          #quit in every respect but its id.
        -->
        <button type="button" id="pause-quit" class="ghost exit" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
          <span class="exit-label">Tilbake til arkaden</span>
        </button>
      </section>

      <!-- Live scoreboard during a match. -->
      <aside id="hud" hidden>
        <ol id="scores"></ol>
        <p id="target-label"></p>
      </aside>

      <!-- Round and match messages. -->
      <div id="banner" hidden>
        <p id="banner-sub"></p>
        <p id="banner-text"></p>
        <div id="banner-actions" hidden>
          <button type="button" id="rematch" class="primary" data-i18n="rematch">Spill igjen</button>
          <button type="button" id="to-menu" class="ghost" data-i18n="to.menu">Tilbake til menyen</button>
        </div>
      </div>

      <!-- Spectator caption: whose ride the camera is on once you are out. -->
      <p id="spectate" hidden>
        <span id="spectate-text"></span>
        <span class="how"><kbd>◀</kbd><kbd>▶</kbd> <span data-i18n="spectate.switch">bytt visning</span></span>
        <!-- Only bots left: play the round out at once (js/main.js onSkip). -->
        <button type="button" id="skip" class="ghost" hidden>
          <span data-i18n="skip">Hopp fram</span> <kbd>Enter</kbd>
        </button>
      </p>

      <!-- Touch steering for rider one. Shown on coarse pointers only. -->
      <div id="touch" hidden>
        <button type="button" id="turn-left" data-i18n-label="turn.left" aria-label="Sving til venstre">◀</button>
        <button type="button" id="turn-right" data-i18n-label="turn.right" aria-label="Sving til høyre">▶</button>
      </div>
    </div>

    <!--
      Crash bar. A module script reports its whole import graph through this
      one tag, so a failure here names js/main.js even when the file that
      actually failed to load was one of its imports.
    -->
    <div id="crash" role="alert" hidden></div>

    <!--
      Babylon and its glTF loader come from jsDelivr pinned to an exact
      version with integrity hashes (the same tags fishtank uses), and the
      vendor/ copies are byte-identical fallbacks for a blocked CDN or LAN
      play with no internet. Each guard runs before the next tag, so load
      order never changes.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/babylonjs@8.56.2/babylon.js"
      integrity="sha384-bJ7uvrJB0MXh1qhQouRHX/NbjOQywkt/ZxeFnrMiiFYG8InDFZlQdzVpAGaMhfwZ"
      crossorigin="anonymous"
      data-handled="vendor/babylon.js"
    ></script>
    <script>
      window.BABYLON ||
        document.write('<script src="vendor/babylon.js"><\/script>');
    </script>
    <!-- The glTF loader for the rider models, pinned and guarded the same way. -->
    <script
      src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.56.2/babylonjs.loaders.min.js"
      integrity="sha384-u+jmBF3Ig/827G8UT4kF+dDbuY0uXakBSGip6BUjiZ7IHqxA44vGxcpx76wGLI3f"
      crossorigin="anonymous"
      data-handled="vendor/loaders.js"
    ></script>
    <script>
      window.BABYLON?.GLTFFileLoader ||
        document.write('<script src="vendor/loaders.js"><\/script>');
    </script>
    <script>
      // Surface load-time failures instead of a silent dark canvas. Classic
      // and self-contained, so it cannot share js/i18n.js: it keeps its own
      // two sentences and reads <html lang>, which the head already set.
      (function () {
        var bar = document.getElementById("crash");
        var nb = function () {
          return document.documentElement.lang !== "en";
        };
        function show(msg) {
          bar.textContent = msg;
          bar.hidden = false;
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            // data-handled marks a script whose failure is already dealt
            // with: the two CDN tags name the vendor copy behind them, and
            // ../arcade/exit.js says "optional" because it is another
            // repo's file and is simply absent when this game is served on
            // its own. Any non-empty value counts.
            if (t && t.tagName === "SCRIPT" && t.dataset && t.dataset.handled)
              return;
            if (t && t.tagName === "SCRIPT") {
              show(
                nb()
                  ? "Et skript kunne ikke lastes: " +
                      t.src +
                      " (står det js/main.js, kan den egentlige synderen være en av filene den importerer)"
                  : "A script failed to load: " +
                      t.src +
                      " (if this is js/main.js, the real culprit may be one of its imports)",
              );
              return;
            }
            show(
              (nb() ? "Noe gikk i stykker: " : "Something broke: ") +
                (e.message || e.type),
            );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          show(
            (nb() ? "Noe gikk i stykker: " : "Something broke: ") +
              (e.reason && e.reason.message ? e.reason.message : e.reason),
          );
        });
      })();
    </script>
    <!--
      The PWA's update affordance, and the service worker registration behind
      it. Its own module graph, loaded BEFORE main.js on purpose: a failed
      import anywhere in the game's graph aborts that whole graph, and an update
      button that dies with the thing it is meant to update is no use to
      anybody. It touches no other module and no other module knows it is here.
    -->
    <script type="module" src="js/update.js"></script>
    <!--
      The fullscreen toggle. Same reasoning as js/update.js just above: its
      own module graph, self-contained, loaded before main.js so a game that
      fails to boot for some unrelated reason does not take this button
      down with it. Not named fullscreen.js — see the header comment in the
      file itself.
    -->
    <script type="module" src="js/screen.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
