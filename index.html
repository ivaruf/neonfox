<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NeonFox</title>
    <meta
      name="description"
      content="Foxes running on glowing orbs, leaving neon trails in a small arena. Touch a trail or the wall and you are out; the last one riding takes the round. A 3D take on Achtung, die Kurve."
    />
    <meta name="theme-color" content="#0a1030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The PWA layer. Every path here is RELATIVE, so the game works from
      /trailblazers/ (the repo's working name), from /neonfox/ once the repo is
      renamed, and from a domain root, with no edits. The arcade reads this
      manifest to build the game's cabinet: it splits `name` on the em-dash into
      a title and a tagline, so that field is doing two jobs.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <!--
      A real 180 for iOS, not the 192 pointed at sideways — see icons/ and
      tools/make-icons.py, which is the source of truth for all four PNGs.
      The tab favicon is an inline SVG of the same mark reduced to its two
      essentials, an orb and the curve behind it: no file, so no request and
      nothing for a filename filter to object to.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a1030'/><path d='M3 27c6 2 13-1 15-7 1-4-2-7-5-6' fill='none' stroke='%2346e6ff' stroke-width='3' stroke-linecap='round'/><circle cx='21' cy='11' r='6' fill='%2346e6ff'/><circle cx='20' cy='10' r='2.6' fill='%23eaf8ff'/></svg>"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--
      The whole game is one WebGL canvas with DOM floating over it. The DOM
      carries everything a player reads or taps (menu, scores, banners, the
      two touch buttons); the canvas carries everything that moves. See
      README.md for the architecture.
    -->
    <canvas id="arena" aria-label="NeonFox arena"></canvas>

    <div id="ui">
      <!-- Title / paddock. Sits over the live attract-mode arena. -->
      <section id="menu" class="panel" aria-labelledby="title">
        <p class="kicker">Neon Kurve for orb riders</p>
        <h1 id="title">NeonFox</h1>

        <!--
          UPDATE READY. Hidden until a new service worker has installed and is
          waiting; tapping it is the only thing in the whole game that posts
          SKIP_WAITING. It sits inside #menu on purpose — the panel is hidden
          for the whole of a match, so the control simply does not exist on
          screen while a round is running and no deploy can end one. Owned end
          to end by js/update.js, which nothing else imports.
        -->
        <button type="button" id="update" hidden>
          <span class="update-title">New build ready</span>
          <span class="update-sub">Tap to take it</span>
        </button>

        <div class="row">
          <span class="label">Riders</span>
          <div class="seg" data-seg="humans" role="group" aria-label="Human riders">
            <button type="button" data-v="1" aria-pressed="true">Solo</button>
            <button type="button" data-v="2">Two, one keyboard</button>
          </div>
        </div>

        <div class="row">
          <span class="label">Rivals</span>
          <div class="seg" data-seg="ai" role="group" aria-label="AI rivals">
            <button type="button" data-v="1">1</button>
            <button type="button" data-v="2">2</button>
            <button type="button" data-v="3" aria-pressed="true">3</button>
            <button type="button" data-v="4">4</button>
            <button type="button" data-v="5">5</button>
          </div>
        </div>

        <div class="row">
          <label class="label" for="arena-size">Arena</label>
          <div class="slider">
            <input
              type="range"
              id="arena-size"
              min="0"
              max="4"
              step="1"
              value="2"
              aria-valuetext="Classic"
            />
            <output id="arena-name" for="arena-size">Classic</output>
          </div>
        </div>

        <div class="row">
          <label class="label" for="target">Win at</label>
          <div class="slider">
            <input type="range" id="target" min="5" max="60" step="5" value="15" />
            <output id="target-out" for="target">15 pts</output>
          </div>
        </div>

        <button type="button" id="start" class="primary">Blaze!</button>
        <button type="button" id="together" class="ghost">Play together</button>

        <p class="hint">
          <kbd>←</kbd><kbd>→</kbd> steer · rider two on <kbd>A</kbd><kbd>D</kbd>
          · <kbd>R</kbd> restarts the match · steer while the round loads to aim
        </p>

        <div class="row">
          <label class="label" for="music-vol">Music</label>
          <div class="slider">
            <input type="range" id="music-vol" min="0" max="100" step="1" value="60" />
            <output id="music-vol-out" for="music-vol">60</output>
          </div>
        </div>

        <div class="row">
          <label class="label" for="sfx-vol">Effects</label>
          <div class="slider">
            <input type="range" id="sfx-vol" min="0" max="100" step="1" value="80" />
            <output id="sfx-vol-out" for="sfx-vol">80</output>
          </div>
        </div>

        <!--
          Which build is actually serving this session, asked of the service
          worker rather than baked into the page — a string compiled into the
          HTML tells you where the HTML came from, which during a bad release is
          the one thing you already know. Stays hidden when there is no worker.
        -->
        <p id="build" hidden></p>
      </section>

      <!-- Live scoreboard during a match. -->
      <aside id="hud" hidden>
        <ol id="scores"></ol>
        <p id="target-label"></p>
      </aside>

      <!-- Round and match messages. -->
      <div id="banner" hidden>
        <p id="banner-sub"></p>
        <p id="banner-text"></p>
        <div id="banner-actions" hidden>
          <button type="button" id="rematch" class="primary">Rematch</button>
          <button type="button" id="to-menu" class="ghost">Back to the paddock</button>
        </div>
      </div>

      <!-- Spectator caption: whose ride the camera is on once you are out. -->
      <p id="spectate" hidden>
        <span id="spectate-text"></span>
        <span class="how"><kbd>◀</kbd><kbd>▶</kbd> switch view</span>
      </p>

      <!-- Touch steering for rider one. Shown on coarse pointers only. -->
      <div id="touch" hidden>
        <button type="button" id="turn-left" aria-label="Turn left">◀</button>
        <button type="button" id="turn-right" aria-label="Turn right">▶</button>
      </div>
    </div>

    <!--
      Crash bar. A module script reports its whole import graph through this
      one tag, so a failure here names js/main.js even when the file that
      actually failed to load was one of its imports.
    -->
    <div id="crash" role="alert" hidden></div>

    <!--
      Babylon and its glTF loader come from jsDelivr pinned to an exact
      version with integrity hashes (the same tags fishtank uses), and the
      vendor/ copies are byte-identical fallbacks for a blocked CDN or LAN
      play with no internet. Each guard runs before the next tag, so load
      order never changes.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/babylonjs@8.56.2/babylon.js"
      integrity="sha384-bJ7uvrJB0MXh1qhQouRHX/NbjOQywkt/ZxeFnrMiiFYG8InDFZlQdzVpAGaMhfwZ"
      crossorigin="anonymous"
      data-handled="vendor/babylon.js"
    ></script>
    <script>
      window.BABYLON ||
        document.write('<script src="vendor/babylon.js"><\/script>');
    </script>
    <!-- The glTF loader for the rider models, pinned and guarded the same way. -->
    <script
      src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.56.2/babylonjs.loaders.min.js"
      integrity="sha384-u+jmBF3Ig/827G8UT4kF+dDbuY0uXakBSGip6BUjiZ7IHqxA44vGxcpx76wGLI3f"
      crossorigin="anonymous"
      data-handled="vendor/loaders.js"
    ></script>
    <script>
      window.BABYLON?.GLTFFileLoader ||
        document.write('<script src="vendor/loaders.js"><\/script>');
    </script>
    <script>
      // Surface load-time failures instead of a silent dark canvas.
      (function () {
        var bar = document.getElementById("crash");
        function show(msg) {
          bar.textContent = msg;
          bar.hidden = false;
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT" && t.dataset && t.dataset.handled) return;
          if (t && t.tagName === "SCRIPT") {
            show(
              "A script failed to load: " +
                t.src +
                " (if this is js/main.js, the real culprit may be one of its imports)"
            );
            return;
          }
          show("Something broke: " + (e.message || e.type));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("Something broke: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
    <!--
      The PWA's update affordance, and the service worker registration behind
      it. Its own module graph, loaded BEFORE main.js on purpose: a failed
      import anywhere in the game's graph aborts that whole graph, and an update
      button that dies with the thing it is meant to update is no use to
      anybody. It touches no other module and no other module knows it is here.
    -->
    <script type="module" src="js/update.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
